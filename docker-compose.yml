version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: aiupwork_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: {{MYSQL_ROOT_PASSWORD}}
      MYSQL_DATABASE: {{MYSQL_DATABASE}}
      MYSQL_USER: {{MYSQL_USER}}
      MYSQL_PASSWORD: {{MYSQL_PASSWORD}}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p{{MYSQL_PASSWORD}}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Celery and Channels
  redis:
    image: redis:7-alpine
    container_name: aiupwork_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build: ./backend
    container_name: aiupwork_backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/__pycache__/
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME={{DB_NAME}}
      - DB_USER=root
      - DB_PASSWORD={{DB_PASSWORD}}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY={{GROQ_API_KEY}}
      - APIFY_API_TOKEN={{APIFY_API_TOKEN}}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"

  # Celery Worker
  celery:
    build: ./backend
    container_name: aiupwork_celery
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - DB_NAME={{DB_NAME}}
      - DB_USER=root
      - DB_PASSWORD={{DB_PASSWORD}}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GROQ_API_KEY={{GROQ_API_KEY}}
      - APIFY_API_TOKEN={{APIFY_API_TOKEN}}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend worker --loglevel=info

  # Celery Beat (for scheduled tasks)
  celery-beat:
    build: ./backend
    container_name: aiupwork_celery_beat
    restart: unless-stopped
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - DB_NAME={{DB_NAME}}
      - DB_USER=root
      - DB_PASSWORD={{DB_PASSWORD}}
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend beat --loglevel=info

  # Next.js Frontend
  frontend:
    build: ./frontend
    container_name: aiupwork_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  static_volume:
  media_volume: